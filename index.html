<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сортировка: Цвет и Форма</title>
  <link rel="stylesheet" href="style.css?v=20260727">
  <!-- SDK Яндекс Игр: подключается ДО инициализации (п. журнала 2026-06-21) -->
  <script src="vk-bridge.min.js?v=20260718b"></script>
</head>
<body>

  <!-- Экран загрузки -->
  <div id="screen-loading" class="screen active">
    <div class="loading-box">
      <div class="loading-title" data-i18n="title">Сортировка: Цвет и Форма</div>
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <!-- Главное меню -->
  <div id="screen-menu" class="screen">
    <div class="menu-box">
      <h1 class="game-title" data-i18n="title">Сортировка: Цвет и Форма</h1>
      <!-- Серия входов (ТЗ №14 этап 2, retention.js) — видна ПОСТОЯННО
           на главном экране, не hidden (см. renderRetentionStreakLine). -->
      <p id="retention-streak-line" class="retention-line"></p>
      <!-- ТЗ №14, этап 3, п.3.1: одно доминирующее действие — «Играть»
           крупная акцентная кнопка (.btn-play-hero, ТОЛЬКО здесь — не
           трогаем .btn-primary глобально, им же несут кнопки магазина/
           оверлеев победы), «Уровни»/«Магазин» — вторичные мелкие
           кнопки под ней (.btn-menu-secondary). Только вёрстка/стили,
           логика переходов не тронута. -->
      <button id="btn-play" class="btn btn-primary btn-play-hero" data-i18n="play">Играть</button>
      <button id="btn-levels" class="btn btn-menu-secondary" data-i18n="levels">Уровни</button>
      <!-- Гейт видимости — Platform.SHOP_SUPPORTED (main.js, typeof-
           проверка): на ВК-сборке (build.py vk, отдельное ТЗ) поля нет
           у vk_platform.js — кнопка остаётся hidden, магазина там нет
           вовсе, не просто «недоступно». -->
      <button id="btn-shop" class="btn btn-menu-secondary hidden" data-i18n="shop">Магазин</button>
      <button id="btn-sound" class="btn btn-icon" aria-label="sound">♪</button>
    </div>
  </div>

  <!-- Магазин (ТЗ №2): база (бесплатная тёплая тема) + 3 покупаемые
       цветовые темы, одна структура данных (main.js SHOP_THEMES) —
       renderShop() строит карточки из массива, разметка не хардкодит
       ни одну тему по отдельности. Карточка — тот же силуэт мини-колбы
       (.shop-vial-preview/.shop-vial-el), что был у одиночной карточки
       в меню раньше. -->
  <div id="screen-shop" class="screen">
    <header class="game-header">
      <button id="btn-shop-back" class="btn btn-icon">←</button>
      <div class="level-indicator" data-i18n="shop">Магазин</div>
      <span class="btn btn-icon spacer" aria-hidden="true"></span>
    </header>
    <div id="shop-wrap" class="shop-wrap">
      <div id="shop-list" class="shop-list"></div>
    </div>
  </div>

  <!-- Экран сетки уровней: прогресс + прыжок на любой уже открытый -->
  <div id="screen-grid" class="screen">
    <header class="game-header game-header-grid">
      <div class="game-header-row">
        <button id="btn-grid-back" class="btn btn-icon">←</button>
        <div class="level-indicator" data-i18n="levels">Уровни</div>
        <span class="btn btn-icon spacer" aria-hidden="true"></span>
      </div>
      <!-- Раздатчик (ТЗ №14 этап 2, retention.js) — строка «сколько ждёт
           + когда ещё» и rewarded-кнопка «Открыть ещё +N» (без общего
           числа уровней кампании — запрет модуля). Растёт высота шапки
           само (syncHeaderSpace меряет реальный рендер), grid-wrap
           подстраивается через --header-h, отдельно трогать не нужно. -->
      <p id="retention-drip-line" class="retention-line"></p>
      <button id="retention-rewarded-btn" class="btn retention-rewarded-btn" hidden></button>
    </header>
    <div id="grid-wrap" class="grid-wrap">
      <div id="level-grid" class="level-grid"></div>
    </div>
  </div>

  <!-- Игровой экран (заглушка Фазы 0, наполняется в Фазе 1-2) -->
  <div id="screen-game" class="screen">
    <header class="game-header">
      <button id="btn-back" class="btn btn-icon">←</button>
      <div id="level-indicator" class="level-indicator"></div>
      <button id="btn-sound-game" class="btn btn-icon" aria-label="sound">♪</button>
    </header>
    <main id="board-wrap" class="board-wrap">
      <canvas id="board-canvas"></canvas>
    </main>
    <button id="btn-undo" class="btn btn-icon undo-btn hidden" aria-label="undo">↺</button>
    <div class="hint-wrap">
      <button id="btn-hint" class="btn btn-icon hint-btn" aria-label="hint">
        ?
        <span class="hint-ad-badge" aria-hidden="true">▶</span>
        <!-- Бейдж остатка бесплатных подсказок (ТЗ №14 этап 3, п.3.2 —
             перенос решения нонограмм ТЗ №03 модуля): скрыт при нуле,
             число без знаменателя, pointer-events:none (тап — кнопке),
             см. renderHintBonusBadge в main.js. -->
        <span id="hint-bonus-badge" class="hint-bonus-badge hidden" aria-hidden="true"></span>
      </button>
      <div class="hint-ad-label" data-i18n="hintAd">Подсказка за рекламу</div>
    </div>
    <div id="hint-toast" class="hint-toast hidden" data-i18n="noMoves">Нет доступных ходов</div>

    <!-- Оверлей победы (за уровень). Полоса прогресса главы (п.1 фазы 3
         «хук экрана победы») и увеличенная кнопка «Дальше» (п.2) —
         решение основателя. Времени уровня здесь НЕТ (п.4, обратимо) —
         таймер только в финале, антистресс-тон жанра; статистика уже
         есть на экране главы и в финале. -->
    <div id="win-overlay" class="win-overlay hidden">
      <div class="win-box">
        <div class="win-title" data-i18n="win">Уровень пройден!</div>
        <div class="win-chapter-progress">
          <div class="progress-track"><div class="progress-fill" id="win-progress-fill"></div></div>
          <div class="progress-label" id="win-progress-label"></div>
        </div>
        <button id="btn-next" class="btn btn-primary btn-next-big" data-i18n="next">Дальше</button>
      </div>
    </div>

    <!-- Оверлей завершения кампании (после последнего уровня) -->
    <div id="campaign-overlay" class="win-overlay hidden">
      <div class="win-box campaign-box">
        <div class="win-title" data-i18n="campaignWinTitle">Поздравляем! Вы прошли все уровни</div>
        <div class="campaign-note" data-i18n="campaignWinNote">Следите за обновлениями — скоро добавим новые</div>
        <div class="campaign-stats">
          <div class="stat">
            <span class="stat-value" id="stat-total"></span>
            <span class="stat-label" data-i18n="statTotal">Всего</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-average"></span>
            <span class="stat-label" data-i18n="statAverage">В среднем</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-fastest"></span>
            <span class="stat-label" data-i18n="statFastest">Быстрее всего</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-slowest"></span>
            <span class="stat-label" data-i18n="statSlowest">Дольше всего</span>
          </div>
        </div>
        <button id="btn-campaign-menu" class="btn btn-primary" data-i18n="campaignMenu">В меню</button>
      </div>
    </div>

    <!-- Оверлей завершения главы (каждые 12 уровней, легче финального:
         короче конфетти, без фанфары, компактнее карточка) -->
    <div id="chapter-overlay" class="win-overlay chapter-overlay hidden">
      <div class="win-box chapter-box">
        <div class="win-title chapter-title" id="chapter-title"></div>
        <div class="campaign-stats">
          <div class="stat">
            <span class="stat-value" id="chapter-stat-total"></span>
            <span class="stat-label" data-i18n="statTotal">Всего</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="chapter-stat-average"></span>
            <span class="stat-label" data-i18n="statAverage">В среднем</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="chapter-stat-fastest"></span>
            <span class="stat-label" data-i18n="statFastest">Быстрее всего</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="chapter-stat-slowest"></span>
            <span class="stat-label" data-i18n="statSlowest">Дольше всего</span>
          </div>
        </div>
        <button id="btn-chapter-next" class="btn btn-primary" data-i18n="next">Дальше</button>
      </div>
    </div>

    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>
  </div>

  <!-- Плашка номера билда (задача 14, перенесено из feature/vk-resubmit,
       свой аналог для Яндекс-адаптера): неинтерактивная
       (pointer-events:none, не ловит клики), низкая непрозрачность,
       левый нижний угол с учётом safe-area (style.css). Текст задаёт
       main.js ТОЛЬКО если Platform.BUILD — реальная строка (typeof-гейт),
       которую build.py подставляет вместо плейсхолдера-заглушки в
       platform.js только в собранный архив (файл на диске не трогается).
       Для промо-скриншота: добавь ?nobuild=1 к адресу страницы перед
       съёмкой — main.js прочитает параметр и не покажет плашку вовсе. -->
  <div id="build-badge" class="build-badge hidden" aria-hidden="true"></div>

  <!-- Отклик модуля удержания (ТЗ №14 этап 2, retention.js) — «тихих
       улучшений не бывает»: любая реальная выдача раздатчика/rewarded/
       награда серии видна тостом, поверх ЛЮБОГО активного экрана
       (position:fixed, не привязан к конкретному .screen). -->
  <div id="retention-reward-toast" class="retention-toast" hidden></div>

  <script src="i18n.js?v=20260727"></script>
  <script src="vk_platform.js?v=20260718b"></script>
  <script src="levels.js?v=20260719"></script>
  <script src="board.js"></script>
  <script src="sound.js?v=20260727"></script>
  <script src="confetti.js?v=20260719"></script>
  <script src="stats.js?v=20260717"></script>
  <script src="game.js?v=20260727"></script>
  <!-- Модуль удержания (ТЗ №14 этап 2, перенесён с нонограмм) — грузится
       СТРОГО перед main.js: main.js читает глобал Retention при
       разборе (RETENTION_CONFIG). Обе площадки (в отличие от нонограмм,
       где модуль был только на ВК) — общий index.html/белый список. -->
  <script src="retention.js?v=1"></script>
  <script src="main.js?v=20260727"></script>
</body>
</html>
